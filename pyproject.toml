[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ans-feeds"
version = "0.1.0"
description = "Events of Brazilian health plan operators (ANS open data) published as static Atom feeds"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ans-feeds = "ans_feeds.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ans_feeds"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Research scripts (stdlib, run with python3 -I) keep their own style.
extend-exclude = ["pesquisa", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
