name: feeds

# Daily: snapshot what the ANS overwrites (scripts/snapshot.sh, curl only), commit it, rebuild the
# static feeds and deploy them to GitHub Pages (Pages source: "GitHub Actions").
#
# The CADOP is published at 10:00 UTC, so the run is at 10:30 UTC. Three jobs on purpose: a
# rendering or deploy failure never loses a snapshot. A source that is down does not stop the
# others: what was fetched is committed, the "Fonte da ANS falhou" issue opens (the alerta action
# from anvisa-hub, closed when the source answers again) and the site is rebuilt with a notice. A
# stalled CADOP and a lagging portal open issues too; red is for what needs a change here
# (RUNBOOK.md). "Run workflow" with build_only only rebuilds the site.

on:
  schedule:
    - cron: "30 10 * * *"   # 07:30 America/Sao_Paulo
  # a code or contract change reaches the site at once (build only, no snapshot)
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/feeds.yml"
  workflow_dispatch:
    inputs:
      build_only:
        description: "Rebuild and deploy the site from committed snapshots, no snapshot"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: feeds
  cancel-in-progress: false   # never abort a snapshot half-way

jobs:
  snapshot:
    if: ${{ github.event_name != 'push' && !inputs.build_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      falhou: ${{ steps.snapshot.outputs.failed }}   # a source failed: the build puts the notice
    permissions:
      contents: write   # commit the snapshot
      issues: write     # the alarm issue (alerta)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - id: day
        run: echo "day=$(TZ=America/Sao_Paulo date +%F)" >> "$GITHUB_OUTPUT"
      # snapshot.sh gets the job's day, so a run that crosses midnight in Brasília files everything,
      # FALHAS.tsv included, under the day the later steps read. FALHAS.tsv is emptied first: a script
      # that stops before rewriting it then leaves no line for the day, even on a second run that day.
      - id: snapshot
        name: Snapshot
        env:
          DAY: ${{ steps.day.outputs.day }}
        run: |
          : > snapshots/FALHAS.tsv
          bash scripts/snapshot.sh snapshots "$DAY" || echo "failed=true" >> "$GITHUB_OUTPUT"
      - name: CADOP diff against the previous snapshot
        run: |
          set -o pipefail   # a crash in cadop_diff.py must not hide behind tee
          day=${{ steps.day.outputs.day }}
          if [ -f "snapshots/$day/Relatorio_cadop.csv" ]; then
            prev=$(ls -d snapshots/20??-??-?? | sed 's:.*/::' | awk -v d="$day" '$0 < d' | tail -1)
            if [ -n "$prev" ]; then
              python3 -I pesquisa/scripts/cadop_diff.py "snapshots/$prev" "snapshots/$day" \
                | tee "snapshots/$day/cadop_diff.txt"
            fi
          fi
      - name: Keep the snapshot as an artifact (survives a failed push)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: snapshot-${{ steps.day.outputs.day }}
          path: |
            snapshots/${{ steps.day.outputs.day }}
            snapshots/ESTADO.tsv
          retention-days: 90
          if-no-files-found: ignore
      - name: Commit and push the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "snapshot ${{ steps.day.outputs.day }}"
          # something may have landed on main meanwhile: rebase and retry, then fail loudly
          git push || (git pull --rebase origin main && git push) \
                   || (sleep 30 && git pull --rebase origin main && git push)
      # after the commit, so what was fetched is kept. snapshot.sh rewrites FALHAS.tsv (day, source,
      # reason) on every run; a failure with no line for today means the script stopped halfway, a
      # problem in the script, which stays red.
      - name: List the sources that failed
        id: fontes
        if: ${{ !cancelled() }}
        env:
          DAY: ${{ steps.day.outputs.day }}
          FALHOU: ${{ steps.snapshot.outputs.failed }}
        run: |
          if [ "$FALHOU" != true ]; then
            echo "estado=normal" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hoje=$(awk -F'\t' -v d="$DAY" '$1 == d {print "- " $2 ": " $3}' snapshots/FALHAS.tsv)
          if [ -z "$hoje" ]; then
            echo "::error::snapshot.sh failed with no source in FALHAS.tsv for $DAY: it stopped halfway"
            exit 1
          fi
          printf '%s\n' "$hoje"
          n=$(grep -c . <<<"$hoje")
          if [ "$n" -eq 1 ]; then
            titulo="Fonte da ANS falhou: 1 fonte com a versão anterior"
          else
            titulo="Fonte da ANS falhou: $n fontes com a versão anterior"
          fi
          {
            echo "estado=ativo"
            echo "titulo=$titulo"
            echo "corpo<<FIM_DO_CORPO"
            echo "Estas fontes da ANS não atualizaram na coleta de $DAY e ficaram com a versão anterior. As outras foram baixadas, e o site saiu com o aviso de coleta com falha."
            echo
            printf '%s\n' "$hoje"
            echo "FIM_DO_CORPO"
          } >> "$GITHUB_OUTPUT"
      - name: Alarm issue for the sources that failed
        if: ${{ !cancelled() }}
        uses: vasfvitor/anvisa-hub/.github/actions/alerta@main
        with:
          chave: ans-fonte-falhou
          titulo: ${{ steps.fontes.outputs.titulo }}
          estado: ${{ steps.fontes.outputs.estado }}
          corpo: ${{ steps.fontes.outputs.corpo }}
          runbook: https://github.com/vasfvitor/ans-feeds/blob/main/RUNBOOK.md#fonte-da-ans-falhou

  build:
    needs: snapshot
    # also after a failed snapshot: the site is rebuilt from what is committed, with a notice
    if: ${{ always() && needs.snapshot.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      date: ${{ steps.estado.outputs.date }}
      cadop_dias: ${{ steps.estado.outputs.cadop_dias }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: main   # the commit the snapshot job just pushed, not this run's SHA
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d   # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Build the site
        env:
          SNAPSHOT: ${{ needs.snapshot.result }}
          FALHOU: ${{ needs.snapshot.outputs.falhou }}
        # a failed source no longer turns the snapshot job red (it opens an issue): the notice reads
        # the job's output too
        run: |
          extra=()
          if [ "$SNAPSHOT" = failure ] || [ "$FALHOU" = true ]; then
            extra=(--notice "A coleta de hoje falhou em parte; estes dados são da última coleta bem-sucedida de cada fonte.")
          fi
          uv run ans-feeds build --snapshots snapshots --site site "${extra[@]}"
      # read here, without failing, for the alarms after the deploy: a red alarm never holds back
      # a deploy. Empty means missing.
      - name: Record the data's date and the CADOP's age
        id: estado
        run: |
          jq -r '"date=\(.date)",
                 "cadop_dias=\(if .cadop_last_modified then (now - (.cadop_last_modified | fromdateiso8601)) / 86400 | floor else "" end)"' \
            site/meta.json >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    # without this, a skipped snapshot (build_only) also skips the deploy
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      issues: write   # the alarm issues (alerta)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1

      # after the deploy, so what was collected is always published. A CADOP (daily at the ANS) that
      # stopped changing and a portal days behind this data (its schedule can be disabled by GitHub
      # and nothing else would notice) open issues; a CADOP with no Last-Modified stays red.
      - name: Check the CADOP's age and the portal's lag
        id: idade
        if: ${{ always() }}
        env:
          DATE: ${{ needs.build.outputs.date }}
          CADOP_DIAS: ${{ needs.build.outputs.cadop_dias }}
          PORTAL: https://saude.abelhaninja.de/build.json
        run: |
          falhou=0
          echo "CADOP: Last-Modified ${CADOP_DIAS:-?} days ago"
          # this site's own date first: without it the lag cannot be measured, and that is not the portal's fault
          if [[ ! "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::this site's meta.json has no date ('$DATE'): the portal's lag was not measured"
            falhou=1
          else
            # retried, so one network blip does not open and close an issue (two mails)
            atraso=$(curl -fsS --retry 3 --retry-delay 10 "$PORTAL?t=$(date +%s)" | jq -r --arg d "$DATE" \
              '(($d | strptime("%Y-%m-%d") | mktime) - (.dados_date | strptime("%Y-%m-%d") | mktime)) / 86400 | floor') || atraso=""
            echo "data here: $DATE; portal: ${atraso:-?} days behind"
          fi
          {
            if [ -n "$CADOP_DIAS" ]; then
              if [ "$CADOP_DIAS" -gt 7 ]; then echo "cadop_estado=ativo"; else echo "cadop_estado=normal"; fi
            fi
            echo "cadop_titulo=CADOP parado na ANS há $CADOP_DIAS dias"
            echo "cadop_corpo=O CADOP, o cadastro das operadoras que a ANS publica todo dia, não muda há $CADOP_DIAS dias. O site segue com o último CADOP publicado."
            if [ "$falhou" -eq 1 ]; then
              :  # not measured: the portal issue stays as it is
            elif [ -z "$atraso" ] || [ "$atraso" -gt 2 ]; then
              echo "portal_estado=ativo"
            else
              echo "portal_estado=normal"
            fi
            if [ -z "$atraso" ]; then
              echo "portal_titulo=O build.json do portal não abriu"
              echo "portal_corpo=Não deu para ler $PORTAL. O portal pode estar fora do ar ou sem certificado."
            else
              echo "portal_titulo=Portal $atraso dias atrás dos dados da ANS"
              echo "portal_corpo=Os dados daqui são de $DATE, e o portal (saude.abelhaninja.de) ainda está com os de $atraso dias antes. Ele lê estes dados e deveria estar no máximo 2 dias atrás."
            fi
          } >> "$GITHUB_OUTPUT"
          if [ -n "$CADOP_DIAS" ] && [ "$CADOP_DIAS" -gt 7 ]; then
            echo "the CADOP has not changed at the ANS for $CADOP_DIAS days"
          fi
          if [ "$falhou" -eq 0 ] && { [ -z "$atraso" ] || [ "$atraso" -gt 2 ]; }; then
            echo "the portal could not be read or is more than 2 days behind $DATE"
          fi
          if [ -z "$CADOP_DIAS" ]; then
            echo "::error::the CADOP has no Last-Modified"
            falhou=1
          fi
          exit "$falhou"
      - name: Alarm issue for a stalled CADOP
        if: ${{ always() }}
        uses: vasfvitor/anvisa-hub/.github/actions/alerta@main
        with:
          chave: ans-cadop-parado
          titulo: ${{ steps.idade.outputs.cadop_titulo }}
          estado: ${{ steps.idade.outputs.cadop_estado }}
          corpo: ${{ steps.idade.outputs.cadop_corpo }}
          runbook: https://github.com/vasfvitor/ans-feeds/blob/main/RUNBOOK.md#cadop-parado-na-ans
      - name: Alarm issue for a lagging portal
        if: ${{ always() }}
        uses: vasfvitor/anvisa-hub/.github/actions/alerta@main
        with:
          chave: ans-portal-atrasado
          titulo: ${{ steps.idade.outputs.portal_titulo }}
          estado: ${{ steps.idade.outputs.portal_estado }}
          corpo: ${{ steps.idade.outputs.portal_corpo }}
          runbook: https://github.com/vasfvitor/ans-feeds/blob/main/RUNBOOK.md#portal-atrasado
